<header class="header">
  <div class="container nav-container">
    <!-- Logo -->
    <a routerLink="/" class="logo">
      <img src="/images/Company_Logo.jpeg" alt="Global Carry Transportation Logo" class="brand-logo" />
      <div class="logo-copy">
        <span class="logo-text">Global <span class="highlight">Carry </span>Transportation</span>
        <span class="brand-subtitle">Freight, Air, Rail & Heavy Transport</span>
        <div class="header-flags-inline">
          <span class="flag-pill-sm" role="img" aria-label="United States">🇺🇸 US</span>
          <span class="flag-pill-sm" role="img" aria-label="Canada">🇨🇦 CA</span>
          <span class="flag-pill-sm" role="img" aria-label="Australia">🇦🇺 AU</span>
        </div>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
      <a routerLink="/about" routerLinkActive="active">About Us</a>
      <a routerLink="/services" routerLinkActive="active">Services</a>
      <a routerLink="/career" routerLinkActive="active">Career</a>
      <a routerLink="/quote" routerLinkActive="active">Request a Quote</a>
      <a routerLink="/contact" routerLinkActive="active">Contact Us</a>
    </nav>

    <!-- CTA Button (Desktop) -->
    <div class="desktop-cta">
      <a routerLink="/quote" class="nav-btn">
        Get a Quote
        <span class="material-symbols-outlined">arrow_forward</span>
      </a>
    </div>

    <!-- Mobile Menu Toggle Button -->
    <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Toggle Navigation Menu">
      <span class="material-symbols-outlined">
        {{ isMenuOpen() ? 'close' : 'menu' }}
      </span>
    </button>
  </div>



  <!-- Mobile Dropdown Navigation -->
  @if (isMenuOpen()) {
    <div class="mobile-nav animate-fade-in-up">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">About Us</a>
      <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">Services</a>
      <a routerLink="/career" routerLinkActive="active" (click)="closeMenu()">Career</a>
      <a routerLink="/quote" routerLinkActive="active" (click)="closeMenu()">Request a Quote</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contact Us</a>
      <a routerLink="/quote" class="mobile-nav-btn" (click)="closeMenu()">Get a Quote</a>
    </div>
  }
</header>
